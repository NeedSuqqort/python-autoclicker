[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "python-autoclicker"
version = "0.1.0"
description = "A desktop autoclicker with configurable hotkeys and macro recording."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "customtkinter",
    "pynput",
]

[tool.setuptools]
py-modules = ["app", "helper"]

[tool.setuptools.packages.find]
where = ["."]
include = ["data*", "models*"]
namespaces = true
